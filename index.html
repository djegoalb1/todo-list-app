<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List - Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1><i class="fas fa-tasks"></i> My To-Do List</h1>
            <p>Manage your tasks efficiently</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Input Section -->
            <div class="input-section">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="taskInput" 
                        placeholder="Add a new task..."
                        class="task-input"
                    >
                    <select id="categorySelect" class="category-select">
                        <option value="work">Work</option>
                        <option value="personal">Personal</option>
                        <option value="shopping">Shopping</option>
                        <option value="health">Health</option>
                        <option value="other">Other</option>
                    </select>
                    <button id="addBtn" class="btn btn-add">
                        <i class="fas fa-plus"></i> Add
                    </button>
                </div>
            </div>

            <!-- Filter Buttons -->
            <div class="filter-section">
                <button class="filter-btn active" data-filter="all">
                    <i class="fas fa-list"></i> All
                </button>
                <button class="filter-btn" data-filter="work">
                    <i class="fas fa-briefcase"></i> Work
                </button>
                <button class="filter-btn" data-filter="personal">
                    <i class="fas fa-user"></i> Personal
                </button>
                <button class="filter-btn" data-filter="shopping">
                    <i class="fas fa-shopping-bag"></i> Shopping
                </button>
                <button class="filter-btn" data-filter="health">
                    <i class="fas fa-heart"></i> Health
                </button>
                <button class="filter-btn" data-filter="completed">
                    <i class="fas fa-check-circle"></i> Completed
                </button>
            </div>

            <!-- Stats -->
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Total Tasks:</span>
                    <span class="stat-value" id="totalTasks">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Completed:</span>
                    <span class="stat-value" id="completedTasks">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Remaining:</span>
                    <span class="stat-value" id="remainingTasks">0</span>
                </div>
            </div>

            <!-- Tasks List -->
            <div class="tasks-section">
                <ul id="tasksList" class="tasks-list">
                    <!-- Tasks will be added here -->
                </ul>
                <div id="emptyState" class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <p>No tasks yet. Add one to get started!</p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button id="clearCompletedBtn" class="btn btn-secondary">
                    <i class="fas fa-trash"></i> Clear Completed
                </button>
                <button id="deleteAllBtn" class="btn btn-danger">
                    <i class="fas fa-times-circle"></i> Delete All
                </button>
            </div>
        </main>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
